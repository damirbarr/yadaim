# Publishes a static, view-only snapshot of the demo to GitHub Pages (scripts/snapshot.mjs).
# The app needs a server, so CI builds it, runs it with fresh demo data (embedded PGlite, dev personas),
# crawls every screen in he/ar/en and pushes the saved pages to the gh-pages branch (written only by this workflow;
# no Actions artifact storage involved). Enable once: Settings → Pages → Source: Deploy from a branch → gh-pages / (root).
name: Demo snapshot (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # No DATABASE_URL: PGlite in ./data, migrated and seeded with demo data (relative to today) on boot.
      - name: Start the app with demo data
        run: |
          AUTH_DEV_BYPASS=1 nohup npm start > app.log 2>&1 &
          npx --yes wait-on@8.0.1 --timeout 120000 http://localhost:3000/login

      - name: Snapshot
        run: node scripts/snapshot.mjs
        env:
          BASE_URL: http://localhost:3000
          OUT_DIR: out-demo
          SNAPSHOT_BASE: /${{ github.event.repository.name }}

      - name: Server log
        if: failure()
        run: tail -n 200 app.log

      - name: Publish to the gh-pages branch
        run: |
          cd out-demo
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo snapshot of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
