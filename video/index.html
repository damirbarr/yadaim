<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ידיים · סרטון</title>
  <style>
    /* Heebo, Hebrew + Latin subsets (OFL, via @fontsource/heebo) */
    @font-face { font-family: Heebo; font-weight: 400; src: url(fonts/heebo-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: Heebo; font-weight: 500; src: url(fonts/heebo-hebrew-500-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: Heebo; font-weight: 700; src: url(fonts/heebo-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: Heebo; font-weight: 800; src: url(fonts/heebo-hebrew-800-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: Heebo; font-weight: 900; src: url(fonts/heebo-hebrew-900-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: Heebo; font-weight: 400; src: url(fonts/heebo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Heebo; font-weight: 500; src: url(fonts/heebo-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Heebo; font-weight: 700; src: url(fonts/heebo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Heebo; font-weight: 800; src: url(fonts/heebo-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Heebo; font-weight: 900; src: url(fonts/heebo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    html, body { margin: 0; background: #092238; }
    body.render canvas { display: block; }
    body:not(.render) canvas { display: block; width: 100vw; max-height: calc(100vh - 56px); object-fit: contain; }
    #ui { position: fixed; inset: auto 0 0 0; height: 56px; display: flex; gap: 12px; align-items: center; padding: 0 16px; background: #0e2a44; color: #fff; font: 500 15px Heebo, sans-serif; }
    #ui[hidden] { display: none; }
    #ui button { height: 40px; min-width: 40px; border-radius: 10px; border: 0; background: #d4f25a; color: #0e2a44; font: 800 15px Heebo, sans-serif; cursor: pointer; }
    #ui input { flex: 1; direction: ltr; }
    #time { direction: ltr; min-width: 130px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui" hidden><button id="play">▶︎ / ❚❚</button><input id="bar" type="range" min="0" value="0" /><span id="time"></span></div>
  <script>if (new URLSearchParams(location.search).has("render")) document.body.classList.add("render");</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
